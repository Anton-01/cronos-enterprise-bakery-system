spring:
  config:
    activate:
      on-profile: dev
  # Local Postgres from docker-compose.yml (service `postgres`) by default; DB_URL still wins when set. Neon is the
  # opt-in `dev-neon` profile (application-dev-neon.yml). An app far from its database pays ~70 ms per statement.
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/cronos}
    username: ${DB_USERNAME:cronos}
    password: ${DB_PASSWORD:cronos}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  jpa:
    properties:
      hibernate:
        generate_statistics: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

# Wider-open actuator for local debugging only — application.yml's base `include: health,prometheus`
# is what ships to qa/prod.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,beans,env,mappings
  endpoint:
    health:
      show-details: always

app:
  observability:
    sql:
      enabled: true

logging:
  level:
    com.ninsky.cronos: INFO
    org.springframework.security: INFO
    # generate_statistics logs one summary per session at DEBUG; INFO keeps only the slow-query lines.
    org.hibernate.stat: INFO
