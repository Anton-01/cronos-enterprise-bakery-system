spring:
  application:
    name: Cronos Bakery Management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cronos_bakery_system_nisnky}
    username: ${DB_USERNAME:cronos_admin_user_bakery-system}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
          time_zone: America/Mexico_City
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # Recipe files (≤ app.kitchen.max-file-size) are the largest upload; smaller limits (avatars 2MB,
      # imports 2MB) are enforced by their own services. Exceeding max-file-size → 413 on field "file".
      max-file-size: 26MB
      max-request-size: 27MB
  messages:
    basename: i18n/messages,i18n/api,i18n/iam,i18n/security,i18n/finance,i18n/kitchen
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: es
    locale-resolver: accept-header
    resources:
      add-mappings: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "dummy-client-id-local-dev.apps.googleusercontent.com"
            client-secret: "dummy-client-secret-local-dev"
            scope:
              - email
              - profile
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: America/Mexico_City
    serialization:
      write-dates-as-timestamps: false

app:
  frontend:
    url: http://localhost:4200
    urlSharePublicRecipe: ${app.frontend.url}/shared/recipe/
    urlSharePublicQuote: ${app.frontend.url}/cronos/cotizaciones/ver/
  cache:
    unit-types:
      ttl: 60
      max-size: 500
  mail:
    sender-address: "no-reply@antonlogic.com"
  # Account settings (profile / avatar / fiscal)
  avatars:
    storage: ${AVATAR_STORAGE:local}            # local | gcs
    # Prefix of every avatarUrl. Default: served by PublicAvatarController under /public/avatars/**.
    # In prod point it at the CDN in front of the bucket (e.g. https://cdn.example.com).
    public-base-url: ${AVATAR_PUBLIC_BASE_URL:http://localhost:9191/api/v1/public}
    local-directory: ${AVATAR_LOCAL_DIR:./uploads}
    # gcs-bucket: defaults to gcp.bucket-name
  account:
    rate-limit:
      avatar-uploads-per-window: 10
      profile-writes-per-window: 30
      fiscal-writes-per-window: 30
      window: 1h
  # Bulk .xlsx catalog imports (POST /unit-type/import, /measurement-unit/import). max-file-size must
  # stay <= spring.servlet.multipart.max-file-size, which rejects bigger uploads first (413).
  imports:
    max-file-size: 2MB
    max-rows: 2000
  # Kitchen catalog & recipes (KitchenProperties)
  kitchen:
    stale-price-days: 60
    synchronous-ripple-limit: 500
    cost-previews-per-minute: 120
    max-file-size: 25MB
    max-files-per-recipe: 40
    tenant-file-quota: 500MB
    signed-url-minutes: 15
    file-purge-after-days: 30
    # Username that receives a copy of the SYSTEM recipe library on startup (empty = none)
    demo-tenant: ${KITCHEN_DEMO_TENANT:}
    job-delay-ms: 15000

server:
  port: 9191
  # Tomcat-level RemoteIpValve: rewrites getScheme/getServerName/getServerPort/getRequestURL from
  # X-Forwarded-* before any Filter runs, so DPoP's htu (computed from getRequestURL()) matches
  # what the client actually targeted even behind a reverse proxy/LB. No-op locally.
  forward-headers-strategy: native
  servlet:
    context-path: /api/v1
  tomcat:
    # Let Tomcat read (and discard) an oversized upload so the client receives the 413 envelope
    # instead of a connection reset.
    max-swallow-size: 30MB
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000  # 7 days
  issuer: auth-service

# Security Configuration
security:
  # Account Lockout
  account-lockout:
    max-attempts: 5
    lockout-duration-minutes: 60
    increment-factor: 2  # Incremento exponencial
    max-lockout-duration-hours: 24

  # Rate Limiting
  rate-limit:
    login:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    register:
      capacity: 5
      refill-tokens: 5
      refill-duration-seconds: 300
    refresh:
      capacity: 20
      refill-tokens: 20
      refill-duration-seconds: 60

  # Password Policy
  password:
    min-length: 8
    max-length: 128
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true
    history-count: 5  # No reutilizar ?ltimas 5 contrase?as

  # Two-Factor Authentication
  two-factor:
    issuer: Cronos
    qr-code-width: 250
    qr-code-height: 250
    window-size: 3  # Ventana de tiempo para c?digos v?lidos

# Logging
logging:
  level:
    root: INFO
    com.ninsky.cronos: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO
  file:
    name: logs/cronos-ninsky.log
  logback:
    rolling-policy:
      max-file-size: 10MB
      max-history: 30

gcp:
  project-id: "cronos-ninsky"
  bucket-name: "cronos-storage-dev"
  credentials-file: "classpath:credentials/gcp-cronos-key.json"

# Actuator on its own internal port, deliberately not under server.servlet.context-path and not
# published to the host in docker-compose.yml — only reachable from other containers (Prometheus).
management:
  server:
    port: 9192
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}