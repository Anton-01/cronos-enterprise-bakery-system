<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="x-apple-disable-message-reformatting"/>
  <title th:text="${email.subject()}">Cronos</title>
</head>
<!--/* Catalog email layout (§7.2, email-template-customization §8): table layout, inline styles, 600 px, brand from the
     email settings. Every value is escaped (th:text / attribute escaping); colors are validated #rrggbb values. */-->
<body style="margin:0;padding:0;background-color:#f1f5f9;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#f1f5f9;"
     th:text="${email.preheader()}">Preheader</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr th:if="${brand.headerImageUrl() != null}">
          <td style="padding:0;line-height:0;font-size:0;">
            <img th:src="${brand.headerImageUrl()}" src="#" width="600" alt="" th:alt="${brand.name()}"
                 style="display:block;width:100%;max-width:600px;height:auto;border:0;"/>
          </td>
        </tr>
        <tr th:if="${brand.headerImageUrl() == null}">
          <td th:style="'height:4px;line-height:4px;font-size:4px;background-color:' + ${brand.primaryColor()} + ';'"
              style="height:4px;line-height:4px;font-size:4px;">&nbsp;</td>
        </tr>
        <tr>
          <td align="center"
              th:style="'padding:24px 40px 18px;border-bottom:2px solid ' + ${brand.accentColor()} + ';'"
              style="padding:24px 40px 18px;">
            <img th:if="${brand.logoUrl() != null}" th:src="${brand.logoUrl()}" src="#" th:alt="${brand.name()}" alt="Cronos" height="40"
                 style="display:block;margin:0 auto;height:40px;width:auto;max-width:240px;border:0;"/>
            <p th:if="${brand.logoUrl() == null}"
               style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:bold;letter-spacing:1px;color:#0f172a;"
               th:text="${brand.name()}">Cronos</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 24px;font-family:Arial,Helvetica,sans-serif;color:#334155;">
            <th:block th:each="block : ${email.blocks()}" th:switch="${block.type().name()}">
              <h1 th:case="'HEADING'"
                  style="margin:0 0 20px;font-size:24px;font-weight:bold;line-height:1.35;color:#0f172a;"
                  th:text="${block.text()}">Heading</h1>
              <p th:case="'PARAGRAPH'" style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#334155;"
                 th:text="${block.text()}">Paragraph</p>
              <table th:case="'BUTTON'" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px auto;">
                <tr>
                  <td align="center" th:style="'border-radius:8px;background-color:' + ${brand.primaryColor()} + ';'">
                    <a th:href="${block.url()}" href="#" target="_blank" rel="noopener noreferrer"
                       style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:8px;"
                       th:text="${block.label()}">Button</a>
                  </td>
                </tr>
              </table>
              <th:block th:case="'CODE'">
                <p style="margin:0 0 8px;padding:14px 18px;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;text-align:center;font-family:'Courier New',Courier,monospace;font-size:20px;letter-spacing:3px;color:#0f172a;"
                   th:text="${block.text()}">CODE</p>
                <p th:if="${block.caption() != null and !#strings.isEmpty(block.caption())}"
                   style="margin:0 0 20px;font-size:13px;text-align:center;color:#64748b;" th:text="${block.caption()}">Caption</p>
                <div th:if="${block.caption() == null or #strings.isEmpty(block.caption())}" style="height:12px;line-height:12px;">&nbsp;</div>
              </th:block>
              <table th:case="'DETAILS'" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="margin:0 0 20px;border:1px solid #e2e8f0;border-radius:6px;">
                <tr th:each="row : ${block.rows()}" th:if="${row.value() != null and !#strings.isEmpty(row.value())}">
                  <td style="padding:10px 14px;font-size:13px;color:#64748b;width:40%;border-bottom:1px solid #f1f5f9;"
                      th:text="${row.label()}">Label</td>
                  <td style="padding:10px 14px;font-size:14px;color:#0f172a;border-bottom:1px solid #f1f5f9;"
                      th:text="${row.value()}">Value</td>
                </tr>
              </table>
              <p th:case="'CALLOUT'"
                 th:style="${calloutStyles.getOrDefault(block.tone(), calloutStyles.get('info'))}"
                 th:text="${block.text()}">Callout</p>
              <ul th:case="'LIST'" style="margin:0 0 20px;padding-left:20px;font-size:15px;line-height:1.7;color:#334155;">
                <li th:each="item : ${block.items()}" th:text="${item}">Item</li>
              </ul>
              <table th:case="'IMAGE'" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;">
                <tr>
                  <td align="center">
                    <a th:if="${block.href() != null}" th:href="${block.href()}" href="#" target="_blank" rel="noopener noreferrer">
                      <img th:src="${block.url()}" src="#" th:alt="${block.alt()}" alt="" th:attr="width=${block.width() != null ? block.width() : 536}"
                           th:style="'display:block;margin:0 auto;width:100%;max-width:' + ${block.width() != null ? block.width() : 536} + 'px;height:auto;border:0;border-radius:10px;'"/>
                    </a>
                    <img th:if="${block.href() == null}" th:src="${block.url()}" src="#" th:alt="${block.alt()}" alt=""
                         th:attr="width=${block.width() != null ? block.width() : 536}"
                         th:style="'display:block;margin:0 auto;width:100%;max-width:' + ${block.width() != null ? block.width() : 536} + 'px;height:auto;border:0;border-radius:10px;'"/>
                  </td>
                </tr>
              </table>
              <hr th:case="'DIVIDER'" style="border:none;border-top:1px solid #e2e8f0;margin:24px 0;"/>
              <p th:case="'SIGNATURE'" style="margin:24px 0 0;font-size:14px;font-style:italic;color:#475569;"
                 th:text="${block.text()}">Signature</p>
            </th:block>
          </td>
        </tr>
        <tr>
          <td align="center"
              style="padding:20px 40px 24px;background-color:#f8fafc;border-top:1px solid #e2e8f0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#64748b;">
            <span th:text="${brand.name()}">Cronos</span> ·
            <a th:href="'mailto:' + ${brand.supportEmail()}" href="#" th:style="'color:' + ${brand.primaryColor()} + ';'"
               th:text="${brand.supportEmail()}">soporte@cronos.mx</a>
            <br th:if="${brand.address() != null and !#strings.isEmpty(brand.address())}"/>
            <span th:if="${brand.address() != null and !#strings.isEmpty(brand.address())}" th:text="${brand.address()}">Ciudad de México</span>
            <th:block th:if="${!email.transactional() and brand.preferencesUrl() != null}">
              <br/>
              <a th:href="${brand.preferencesUrl()}" href="#" th:style="'color:' + ${brand.primaryColor()} + ';'"
                 th:text="${preferencesLabel}">Preferencias de correo</a>
            </th:block>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
