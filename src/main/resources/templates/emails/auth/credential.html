<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${heading}">Cronos Bakery</title>
  <!-- Invitation, password reset, temporary password, email verification and email-change notice; every text is localised by CredentialMailer. -->
  <style>
    body { margin: 0; padding: 0; background-color: #F7EFF4; font-family: Georgia, 'Times New Roman', serif; }
    .email-wrapper { width: 100%; background-color: #F7EFF4; padding: 44px 16px; }
    .email-container { max-width: 580px; margin: 0 auto; background-color: #FEFAF7; border-radius: 6px; overflow: hidden;
      box-shadow: 0 4px 32px rgba(200, 136, 154, 0.12); }
    .accent-bar { height: 5px; background: linear-gradient(90deg, #C7B8DC 0%, #EEC5D0 35%, #C8889A 60%, #C7B8DC 100%); }
    .email-header { background: linear-gradient(160deg, #F9EEF5 0%, #EDE3F5 60%, #E8F3E9 100%); padding: 38px 48px 30px;
      text-align: center; border-bottom: 1px solid #EEC5D0; }
    .brand-name { font-size: 24px; letter-spacing: 0.14em; color: #3D2B35; text-transform: uppercase; margin: 0; }
    .email-body { padding: 38px 48px 36px; }
    .email-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #C8889A; margin: 0 0 16px; }
    .email-heading { font-size: 25px; font-weight: normal; color: #3D2B35; margin: 0 0 22px; line-height: 1.4; }
    .email-text { font-size: 15px; line-height: 1.8; color: #5C4452; margin: 0 0 20px; }
    .secret-box { background: #EAE3F3; border: 1px solid #C7B8DC; border-radius: 4px; padding: 14px 18px; margin: 0 0 24px;
      text-align: center; }
    .secret-label { font-size: 12px; color: #7A5E6A; margin: 0 0 6px; }
    .secret-value { font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 0.08em; color: #3D2B35; margin: 0; }
    .cta-wrapper { text-align: center; margin: 32px 0 28px; }
    .cta-button { display: inline-block; background: linear-gradient(135deg, #C8889A 0%, #B87A8A 100%); color: #FEFAF7 !important;
      text-decoration: none; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; padding: 16px 44px;
      border-radius: 30px; }
    .expiry-notice { background: linear-gradient(90deg, #EAE3F3, #F5E8F0); border-left: 3px solid #C7B8DC; padding: 14px 18px;
      margin: 0 0 24px; font-size: 13px; color: #7A5E6A; line-height: 1.65; }
    .warning-text { font-size: 13px; color: #7A5E6A; line-height: 1.65; margin: 0 0 24px; }
    .fallback-label { font-size: 13px; color: #A08898; margin: 0 0 8px; }
    .fallback-url { font-size: 12px; word-break: break-all; margin: 0; }
    .fallback-url a { color: #C8889A; }
    .email-footer { background: linear-gradient(160deg, #F0E5F2 0%, #E5DFF0 60%, #E4F0E5 100%); border-top: 1px solid #EEC5D0;
      padding: 28px 48px 32px; text-align: center; font-size: 11px; color: #A08898; }
    @media only screen and (max-width: 600px) {
      .email-wrapper { padding: 20px 10px; }
      .email-header, .email-body, .email-footer { padding-left: 22px; padding-right: 22px; }
      .email-heading { font-size: 21px; }
    }
  </style>
</head>
<body>
<div class="email-wrapper">
  <table class="email-container" role="presentation" cellpadding="0" cellspacing="0" width="100%">
    <tr><td><div class="accent-bar"></div></td></tr>
    <tr><td class="email-header"><p class="brand-name">Cronos Bakery</p></td></tr>
    <tr>
      <td class="email-body">
        <p class="email-label" th:text="${label}">Label</p>
        <h1 class="email-heading" th:text="${heading}">Heading</h1>
        <p class="email-text" th:text="${greeting}">Hello</p>
        <p class="email-text" th:text="${body}">Body</p>

        <div class="secret-box" th:if="${secret != null}">
          <p class="secret-label" th:text="${secretLabel}">Temporary password</p>
          <p class="secret-value" th:text="${secret}">********</p>
        </div>

        <div class="cta-wrapper" th:if="${link != null}">
          <a class="cta-button" th:href="${link}" href="#" target="_blank" rel="noopener noreferrer" th:text="${cta}">Open</a>
        </div>

        <p class="expiry-notice" th:if="${expiry != null}" th:text="${expiry}">Expires soon</p>
        <p class="warning-text" th:text="${ignore}">If this was not you, contact support.</p>

        <th:block th:if="${link != null}">
          <p class="fallback-label" th:text="${fallback}">Copy this link</p>
          <p class="fallback-url"><a th:href="${link}" href="#" th:text="${link}">https://example.com</a></p>
        </th:block>
      </td>
    </tr>
    <tr><td class="email-footer" th:text="${footer}">Automatic message</td></tr>
    <tr><td><div class="accent-bar"></div></td></tr>
  </table>
</div>
</body>
</html>
