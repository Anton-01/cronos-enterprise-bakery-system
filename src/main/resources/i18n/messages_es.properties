# Mensajes de validacion de Jakarta Bean Validation (Español). Referenciados desde los DTOs de
# request via sintaxis {key}. Migrado hasta ahora: LoginRequest. El resto de los DTOs de request
# aun usan mensajes en linea por defecto y quedan como trabajo pendiente fuera del alcance de la Fase 1.

validation.username.required=El nombre de usuario es requerido
validation.password.required=La contraseña es requerida
validation.category.name.required=El nombre de la categoría es requerido
validation.category.description.required=La descripción de la categoría es requerida
validation.category.type.required=El tipo de categoría es requerido (PRODUCT o INGREDIENT)

# --- Configuración de cuenta (perfil / avatar / datos fiscales / contraseña) ---
# Las llaves usadas por plantillas de Bean Validation usan {min}/{max}; las de errores de dominio son
# patrones MessageFormat ({0}, {1}; un apóstrofo literal se escribe '').

# Mensajes de éxito
account.profile.retrieved=Perfil obtenido correctamente
account.profile.updated=Perfil actualizado correctamente
account.avatar.updated=Avatar actualizado correctamente
account.avatar.removed=Avatar eliminado correctamente
account.fiscal.retrieved=Datos fiscales obtenidos correctamente
account.fiscal.notRegistered=No hay datos fiscales registrados
account.fiscal.saved=Datos fiscales guardados correctamente
account.password.changed=Contraseña actualizada correctamente

# Genéricos
account.validation.required=Este campo es obligatorio
account.validation.size=Debe tener como máximo {max} caracteres
account.validation.maxLength={0} debe tener como máximo {1} caracteres
account.validation.unknownProperty=La propiedad «{0}» no está permitida
account.validation.unsupportedMediaType=Tipo de contenido no soportado
account.concurrency.preconditionFailed=El recurso cambió desde que lo cargaste. Recarga e inténtalo de nuevo
account.concurrency.conflict=Otro proceso modificó el recurso. Recarga e inténtalo de nuevo
account.rateLimit.avatar=Demasiadas cargas de avatar. Inténtalo de nuevo en {0,number,#} segundos
account.rateLimit.write=Demasiados cambios. Inténtalo de nuevo en {0,number,#} segundos

# Perfil
account.profile.username.required=El nombre de usuario es obligatorio
account.profile.username.size=El nombre de usuario debe tener entre {min} y {max} caracteres
account.profile.username.length=El nombre de usuario debe tener entre {0} y {1} caracteres
account.profile.username.duplicate=El nombre de usuario «{0}» ya está en uso
account.profile.firstName.size=El nombre debe tener como máximo {max} caracteres
account.profile.lastName.size=Los apellidos deben tener como máximo {max} caracteres
account.profile.phoneNumber.invalid=El teléfono debe ser un número internacional válido en formato E.164 (p. ej. +525512345678)

# Avatar
account.avatar.file.required=Se requiere un archivo de imagen
account.avatar.file.tooLarge=La imagen no debe superar {0} MB
account.avatar.file.unsupportedType=Solo se aceptan imágenes JPEG, PNG o WebP
account.avatar.file.tooManyPixels=La imagen es demasiado grande (máximo {0} megapíxeles)
account.avatar.file.tooSmall=La imagen debe medir al menos {0} px en su lado más corto
account.avatar.file.corrupt=La imagen está dañada o no se pudo leer
account.avatar.key.invalid=Referencia de avatar inválida

# Datos fiscales (SAT / CFDI 4.0)
account.fiscal.legalName.required=La razón social es obligatoria
account.fiscal.legalName.size=La razón social debe tener como máximo {0} caracteres
account.fiscal.legalName.corporateSuffix=Captura la razón social sin el régimen societario (p. ej. sin "S.A. DE C.V.")
account.fiscal.taxId.required=El RFC es obligatorio
account.fiscal.taxId.format=El formato del RFC es inválido (13 caracteres para persona física, 12 para persona moral)
account.fiscal.taxId.generic=No se permiten RFC genéricos (XAXX010101000 / XEXX010101000)
account.fiscal.taxId.date=La fecha del RFC (AAMMDD) no es válida
account.fiscal.taxId.checkDigit=El dígito verificador del RFC es inválido
account.fiscal.taxRegime.required=El régimen fiscal es obligatorio
account.fiscal.taxRegime.invalid=El régimen fiscal no es una clave válida del catálogo c_RegimenFiscal del SAT
account.fiscal.taxRegime.notApplicable=El régimen fiscal {0} no aplica a contribuyentes de tipo {1}
account.fiscal.taxRegime.notApplicableToRfc=El régimen fiscal seleccionado no aplica al tipo de contribuyente de este RFC
account.fiscal.state.invalid=El estado debe ser una clave ISO 3166-2:MX (p. ej. CMX, JAL, NLE)
account.fiscal.zipCode.format=El código postal debe tener 5 dígitos (p. ej. 06600)
account.fiscal.zipCode.unknown=El código postal no existe en el catálogo del SAT
account.fiscal.address.country=El país debe ser MEX

# Cambio de contraseña
account.password.invalid=Cambio de contraseña inválido
account.password.currentIncorrect=La contraseña actual es incorrecta
account.password.sameAsCurrent=La nueva contraseña debe ser distinta de la actual
account.password.confirmationMismatch=La confirmación de la contraseña no coincide
account.password.policy=La contraseña no cumple la política: {0}
account.password.reused=Usaste esta contraseña recientemente. Elige otra
