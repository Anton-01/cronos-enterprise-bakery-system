# Mensajes de validacion de Jakarta Bean Validation (Español). Referenciados desde los DTOs de
# request via sintaxis {key}. Migrado hasta ahora: LoginRequest. El resto de los DTOs de request
# aun usan mensajes en linea por defecto y quedan como trabajo pendiente fuera del alcance de la Fase 1.

validation.username.required=El nombre de usuario es requerido
validation.password.required=La contraseña es requerida
validation.category.name.required=El nombre de la categoría es requerido
validation.category.description.required=La descripción de la categoría es requerida
validation.category.type.required=El tipo de categoría es requerido (PRODUCT o INGREDIENT)

# --- Configuración de cuenta (perfil / avatar / datos fiscales / contraseña) ---
