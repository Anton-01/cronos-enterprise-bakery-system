# Jakarta Bean Validation messages (English). Referenced from request DTOs via {key} syntax.
# Migrated so far: LoginRequest. Remaining request DTOs still carry inline default messages
# and are left as follow-up work outside Phase 1's scope.

validation.username.required=Username is required
validation.password.required=Password is required
validation.category.name.required=Category name is required
validation.category.description.required=Category description is required
validation.category.type.required=Category type is required (PRODUCT or INGREDIENT)

# --- Account settings (profile / avatar / fiscal / password) ---
# Keys used by Bean Validation templates take {min}/{max}-style parameters; keys used by domain
# errors are MessageFormat patterns ({0}, {1}; a literal apostrophe must be written '').

# Success messages
account.profile.retrieved=Profile retrieved successfully
account.profile.updated=Profile updated successfully
account.avatar.updated=Avatar updated successfully
account.avatar.removed=Avatar removed successfully
account.fiscal.retrieved=Fiscal data retrieved successfully
account.fiscal.notRegistered=No fiscal data registered
account.fiscal.saved=Fiscal data saved successfully
account.password.changed=Password changed successfully

# Generic
account.validation.required=This field is required
account.validation.size=Must be at most {max} characters
account.validation.maxLength={0} must be at most {1} characters
account.validation.unknownProperty=Property ''{0}'' is not allowed
account.validation.unsupportedMediaType=Unsupported content type
account.concurrency.preconditionFailed=The resource was modified since you loaded it. Reload and try again
account.concurrency.conflict=The resource was modified by another request. Reload and try again
account.rateLimit.avatar=Too many avatar uploads. Try again in {0,number,#} seconds
account.rateLimit.write=Too many changes. Try again in {0,number,#} seconds

# Profile
account.profile.username.required=Username is required
account.profile.username.size=Username must be between {min} and {max} characters
account.profile.username.length=Username must be between {0} and {1} characters
account.profile.username.duplicate=Username ''{0}'' is already taken
account.profile.firstName.size=First name must be at most {max} characters
account.profile.lastName.size=Last name must be at most {max} characters
account.profile.phoneNumber.invalid=Phone number must be a valid international number in E.164 format (e.g. +525512345678)

# Avatar
account.avatar.file.required=An image file is required
account.avatar.file.tooLarge=The image must not exceed {0} MB
account.avatar.file.unsupportedType=Only JPEG, PNG or WebP images are accepted
account.avatar.file.tooManyPixels=The image is too large (maximum {0} megapixels)
account.avatar.file.tooSmall=Image must be at least {0} px on its shorter side
account.avatar.file.corrupt=The image is corrupt or could not be read
account.avatar.key.invalid=Invalid avatar reference

# Fiscal data (SAT / CFDI 4.0)
account.fiscal.legalName.required=Legal name is required
account.fiscal.legalName.size=Legal name must be at most {0} characters
account.fiscal.legalName.corporateSuffix=Enter the legal name without the corporate regime (e.g. without "S.A. DE C.V.")
account.fiscal.taxId.required=RFC is required
account.fiscal.taxId.format=RFC format is invalid (13 characters for individuals, 12 for legal entities)
account.fiscal.taxId.generic=Generic RFCs (XAXX010101000 / XEXX010101000) are not allowed
account.fiscal.taxId.date=The RFC date (YYMMDD) is not a valid date
account.fiscal.taxId.checkDigit=The RFC check digit is invalid
account.fiscal.taxRegime.required=Tax regime is required
account.fiscal.taxRegime.invalid=Tax regime is not a valid SAT c_RegimenFiscal key
account.fiscal.taxRegime.notApplicable=Tax regime {0} does not apply to {1} taxpayers
account.fiscal.taxRegime.notApplicableToRfc=The selected tax regime does not apply to the taxpayer type of this RFC
account.fiscal.state.invalid=State must be an ISO 3166-2:MX code (e.g. CMX, JAL, NLE)
account.fiscal.zipCode.format=Zip code must be 5 digits (e.g. 06600)
account.fiscal.zipCode.unknown=Zip code does not exist in the SAT catalog
account.fiscal.address.country=Country must be MEX

# Password change
account.password.invalid=Invalid password change
account.password.currentIncorrect=Current password is incorrect
account.password.sameAsCurrent=The new password must be different from the current one
account.password.confirmationMismatch=Password confirmation does not match
account.password.policy=Password does not meet the policy: {0}
account.password.reused=This password was used recently. Choose a different one
