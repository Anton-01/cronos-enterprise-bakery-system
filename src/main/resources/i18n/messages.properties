# Locale-neutral base bundle. Required for Spring Boot's MessageSourceAutoConfiguration to
# activate at all (it probes for exactly this file before creating a real MessageSource bean) —
# actual content is served from messages_en.properties / messages_es.properties per request locale;
# this file is the fallback of last resort.

validation.username.required=Username is required
validation.password.required=Password is required
validation.category.name.required=Category name is required
validation.category.description.required=Category description is required
validation.category.type.required=Category type is required (PRODUCT or INGREDIENT)

# --- Account settings (profile / avatar / fiscal / password) ---
# Keys used by Bean Validation templates take {min}/{max}-style parameters; keys used by domain
# errors are MessageFormat patterns ({0}, {1}; a literal apostrophe must be written '').

# Success messages
account.profile.retrieved=Profile retrieved successfully
account.profile.updated=Profile updated successfully
account.avatar.updated=Avatar updated successfully
account.avatar.removed=Avatar removed successfully
account.fiscal.retrieved=Fiscal data retrieved successfully
account.fiscal.notRegistered=No fiscal data registered
account.fiscal.saved=Fiscal data saved successfully
account.password.changed=Password changed successfully

# Generic
account.validation.required=This field is required
account.validation.size=Must be at most {max} characters
account.validation.maxLength={0} must be at most {1} characters
account.validation.unknownProperty=Property ''{0}'' is not allowed
account.validation.unsupportedMediaType=Unsupported content type
account.concurrency.preconditionFailed=The resource was modified since you loaded it. Reload and try again
