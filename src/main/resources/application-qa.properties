# Perfil qa: las credenciales (DB, JWT, mail, KMS) NO se definen aqui.
# Las carga KeysPropertiesEnvironmentPostProcessor desde un archivo externo keys.properties:
#   - macOS: usa la ruta local por defecto del desarrollador si no defines CRONOS_KEYS_FILE.
#   - Windows / otros: define la variable de entorno CRONOS_KEYS_FILE con la ruta al archivo.
# Template: keys.properties.example (raiz del repo).

# Same Neon pool settings as prod (see application-prod.properties).
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}
