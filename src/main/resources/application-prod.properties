logging.level.root=INFO
logging.level.com.ninsky.cronos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Neon is serverless: idle compute auto-suspends and connections can be silently dropped/rebuilt
# behind the scenes. A short max-lifetime forces HikariCP to recycle connections before Neon does,
# instead of handing out a connection Neon already closed (the "Failed to validate connection...
# This connection has been closed" failure mode). keepalive-time pings idle connections so they
# don't go stale between borrows.
#
# Run the app in the same region as the Neon branch (us-east-2) and turn scale-to-zero off on that branch: a cold
# compute adds 0.5-3 s to the first request after idle. The -pooler endpoint (PgBouncer, transaction mode) needs
# prepareThreshold=0; with the direct endpoint set DB_PREPARE_THRESHOLD=5. Pool sized for virtual threads.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}

management.endpoint.health.show-details=never

# Account settings: avatars live in GCS behind a CDN. TODO(ops): set AVATAR_PUBLIC_BASE_URL to the
# CDN origin that serves gs://<bucket>/avatars/** (objects are immutable, content-addressed).
app.avatars.storage=${AVATAR_STORAGE:gcs}
app.avatars.public-base-url=${AVATAR_PUBLIC_BASE_URL:http://localhost:9191/api/v1/public}

# Email images (email-template-customization §4.6): GCS behind a public CDN (e.g. https://assets.cronos.mx); template
# and settings images must live on that host. TODO(ops): set MAIL_ASSET_PUBLIC_BASE_URL and MAIL_VERIFIED_DOMAINS.
app.mail.assets.storage=${MAIL_ASSET_STORAGE:gcs}
app.mail.assets.public-base-url=${MAIL_ASSET_PUBLIC_BASE_URL:http://localhost:9191/api/v1/public/mail-assets}
app.mail.assets.enforce-host=true
