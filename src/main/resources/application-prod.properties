# Perfil prod: las credenciales (DB, JWT, mail, KMS) NO se definen aqui.
# Las carga KeysPropertiesEnvironmentPostProcessor desde /etc/cronos/keys.properties
# (server operator: archivo fuera del directorio de despliegue/git, owner = usuario de servicio
# de la JVM, permisos 600). Override con la variable de entorno CRONOS_KEYS_FILE si tu
# infraestructura monta el archivo en otra ruta (Docker secret, volumen de k8s, etc).
# Plantilla: keys.properties.example (raiz del repo).

# Evita filtrar SQL/detalles de auth en logs de produccion.
logging.level.root=INFO
logging.level.com.ninsky.cronos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
