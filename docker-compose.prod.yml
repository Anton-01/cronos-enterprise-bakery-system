# Production stack: full packaged image (Dockerfile's `runtime` stage), SPRING_PROFILES_ACTIVE=prod.
# Secrets load exclusively from an external keys.properties via
# KeysPropertiesEnvironmentPostProcessor, mounted at /etc/cronos/keys.properties — that's the exact
# PROD_DEFAULT_PATH the loader already falls back to on the prod profile, so CRONOS_KEYS_FILE is set
# explicitly below anyway, for the same reason a senior engineer prefers an explicit config over a
# working-by-coincidence default: it stays correct if that class's default path ever changes.
#
# SECURITY — read before running this on a real host:
#   - Grafana/Prometheus/Loki ports below are published for convenience. On a real prod box, put
#     this behind a firewall/VPN/reverse-proxy with auth, or drop the `ports:` mappings on those
#     services entirely and reach them over an SSH tunnel / internal network instead. This compose
#     file does not do that for you.
#   - The keys.properties file mounted below must be owned by the account running Docker, mode 600,
#     outside any git-tracked or web-served directory — see keys.properties.example and
#     KeysPropertiesEnvironmentPostProcessor's class docs.
#   - src/main/resources/credentials/gcp-cronos-key.json, if present at build time, gets baked into
#     the image (see context.md's "Infrastructure & DevOps" section) — do not build this image on a
#     machine where you don't want that key embedded. Production should use Workload Identity /an
#     attached service account instead; this wasn't changed here (out of scope, flagged in context.md).
#
# Usage:
#   CRONOS_KEYS_FILE_HOST=/etc/cronos/keys.properties docker compose -f docker-compose.prod.yml up -d --build
# or just:
#   ./scripts/start-prod.sh

services:
  app:
    build:
      context: .
    ports:
      - "9191:9191" # REST API (server.servlet.context-path=/api/v1)
    expose:
      - "9192" # Actuator — internal only, scraped by Prometheus
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CRONOS_KEYS_FILE: /etc/cronos/keys.properties
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${CRONOS_KEYS_FILE_HOST:?Set CRONOS_KEYS_FILE_HOST to your prod keys.properties path}:/etc/cronos/keys.properties:ro
      - logs-prod:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data-prod:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - logs-prod:/var/log/cronos:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-prod:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # admin / ${GRAFANA_ADMIN_PASSWORD:-admin} — see SECURITY note above
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD — no admin/admin default in prod}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-prod:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  redis-data-prod:
  loki-data-prod:
  prometheus-data-prod:
  grafana-data-prod:
  logs-prod:
