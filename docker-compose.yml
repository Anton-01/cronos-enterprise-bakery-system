# Local development stack for Cronos.
#
# The database is the `postgres` service below (Flyway builds the schema on first start). Every SQL
# statement against a remote database pays the network round trip (~70 ms to Neon us-east-2 from a
# laptop), so dev runs next to its database. Neon stays available as an opt-in profile:
#   CRONOS_PROFILES=dev,dev-neon docker compose watch     # reads NEON_DB_URL/NEON_DB_USERNAME/NEON_DB_PASSWORD
#
# Hot reload: `docker compose watch` builds the `app` service up to the `builder` stage (JDK +
# resolved deps + compiled source, see Dockerfile), then runs it via `mvnw spring-boot:run` instead
# of the packaged jar. Saved changes under src/main/java or src/main/resources are synced straight
# into the running container; spring-boot-devtools (pom.xml) detects the classpath change and
# restarts the embedded Spring context in place — no container rebuild. Editing pom.xml triggers a
# full image rebuild instead, since dependencies changed.
#
# Usage:
#   cp .env .env   # fill in real values
#   docker compose watch
#
# Secrets: the app service reads DB_URL/DB_USERNAME/DB_PASSWORD/MAIL_PASSWORD/JWT_SECRET straight
# from .env (env_file below) — KeysPropertiesEnvironmentPostProcessor deliberately no-ops on the
# `dev` profile unless CRONOS_KEYS_FILE is set. If you already maintain a keys.properties file for
# qa/prod (see keys.properties), reuse it instead of duplicating secrets into .env: add
# `-f docker-compose.keys-file.yml` (see that file for usage).

services:
  app:
    build:
      context: .
      target: builder
    working_dir: /build
    command: >
      ./mvnw -B spring-boot:run
      -Dspring-boot.run.profiles=${CRONOS_PROFILES:-dev}
      -Dspring-boot.run.jvmArguments=--sun-misc-unsafe-memory-access=allow
    ports:
      - "9191:9191"
    expose:
      - "9192" # Actuator — internal only, scraped by Prometheus
    env_file:
      - .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${CRONOS_PROFILES:-dev}
      # Overrides any DB_* in .env: dev talks to the local container (dev-neon reads NEON_DB_* instead).
      DB_URL: jdbc:postgresql://postgres:5432/cronos
      DB_USERNAME: cronos
      DB_PASSWORD: cronos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - maven-repo:/root/.m2
      - ./logs:/build/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    develop:
      watch:
        - path: ./src/main/java
          action: sync+restart
          target: /build/src/main/java
        - path: ./src/main/resources
          action: sync+restart
          target: /build/src/main/resources
        - path: ./pom.xml
          action: rebuild
        - path: ./lombok.config
          action: rebuild

  # Dev database. Same major version as Neon; data survives restarts in the postgres-data volume.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cronos
      POSTGRES_USER: cronos
      POSTGRES_PASSWORD: cronos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronos -d cronos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backs the token/session blacklist (TokenBlacklistService) and Redisson distributed locks.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Intercepts every outgoing email (password reset, new-device, share-quote/recipe) instead of
  # hitting SendGrid. Web UI to inspect sent mail: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/cronos:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # admin / ${GRAFANA_ADMIN_PASSWORD:-admin}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  postgres-data:
  maven-repo:
  redis-data:
  loki-data:
  prometheus-data:
  grafana-data:
