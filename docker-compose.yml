# Local development stack for Cronos.
#
# The primary database (Neon, serverless Postgres) is NOT containerized here — it's external.
# Point DB_URL/DB_USERNAME/DB_PASSWORD (in .env, see .env.example) at your Neon connection string,
# including `?sslmode=require`.
#
# Hot reload: `docker compose watch` builds the `app` service up to the `builder` stage (JDK +
# resolved deps + compiled source, see Dockerfile), then runs it via `mvnw spring-boot:run` instead
# of the packaged jar. Saved changes under src/main/java or src/main/resources are synced straight
# into the running container; spring-boot-devtools (pom.xml) detects the classpath change and
# restarts the embedded Spring context in place — no container rebuild. Editing pom.xml triggers a
# full image rebuild instead, since dependencies changed.
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker compose watch
#
# Secrets: the app service reads DB_URL/DB_USERNAME/DB_PASSWORD/MAIL_PASSWORD/JWT_SECRET straight
# from .env (env_file below) — KeysPropertiesEnvironmentPostProcessor deliberately no-ops on the
# `dev` profile unless CRONOS_KEYS_FILE is set. If you already maintain a keys.properties file for
# qa/prod (see keys.properties.example), reuse it instead of duplicating secrets into .env: add
# `-f docker-compose.keys-file.yml` (see that file for usage).

services:
  app:
    build:
      context: .
      target: builder
    working_dir: /build
    command: >
      ./mvnw -B spring-boot:run
      -Dspring-boot.run.profiles=dev
      -Dspring-boot.run.jvmArguments=--sun-misc-unsafe-memory-access=allow
    ports:
      - "9191:9191" # REST API (server.servlet.context-path=/api/v1)
    expose:
      - "9192" # Actuator — internal only, scraped by Prometheus
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - maven-repo:/root/.m2
      - ./logs:/build/logs
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    develop:
      watch:
        # sync+restart, not sync: `mvnw spring-boot:run` only recompiles on (re)start — devtools'
        # in-JVM restart watches target/classes, not src/, so a plain file sync with no restart
        # leaves the container running stale compiled classes with the new source never built.
        # sync+restart re-runs the container's `mvnw spring-boot:run` after the file lands, which
        # recompiles just the changed sources and restarts in ~5s — no docker image rebuild.
        - path: ./src/main/java
          action: sync+restart
          target: /build/src/main/java
        - path: ./src/main/resources
          action: sync+restart
          target: /build/src/main/resources
        - path: ./pom.xml
          action: rebuild

  # Backs the token/session blacklist (TokenBlacklistService) and Redisson distributed locks.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Intercepts every outgoing email (password reset, new-device, share-quote/recipe) instead of
  # hitting SendGrid. Web UI to inspect sent mail: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/cronos:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # admin / ${GRAFANA_ADMIN_PASSWORD:-admin}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  maven-repo:
  redis-data:
  loki-data:
  prometheus-data:
  grafana-data:
