groups:
  - name: cronos-latency
    rules:
      # performance-latency P2-4: requests are queueing for a database connection.
      - alert: HikariPoolPending
        expr: max(hikaricp_connections_pending) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Requests waiting for a database connection for more than 30 s"
          description: "hikaricp_connections_pending = {{ $value }}. Check slow statements (cronos.db.statement p95) and the pool size."
      # The §2 budget for every read endpoint is 3 statements.
      - alert: TooManyStatementsPerRequest
        expr: histogram_quantile(0.95, sum by (le, method, uri) (rate(cronos_http_db_statements_bucket[5m]))) > 3
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.method }} {{ $labels.uri }} runs more than 3 SQL statements at p95"
      - alert: SlowRequestsP95
        expr: histogram_quantile(0.95, sum by (le, method, uri) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*|/notifications/stream"}[5m]))) > 0.35
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.method }} {{ $labels.uri }} p95 above 350 ms"
  - name: cronos-mail
    rules:
      # email-template-customization §5.1: the effective template is read on every outgoing email; a low hit ratio
      # means evictions are too broad or the cache is undersized, and the dispatcher is hitting the database.
      - alert: EmailEffectiveCacheHitRatioLow
        expr: |
          sum(rate(cache_gets_total{cache="email.effective",result="hit"}[15m]))
            / clamp_min(sum(rate(cache_gets_total{cache="email.effective"}[15m])), 1e-9) < 0.95
          and sum(rate(cache_gets_total{cache="email.effective"}[15m])) > 0.01
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "email.effective cache hit ratio below 95 %"
          description: "Hit ratio = {{ $value | humanizePercentage }}. Check eviction volume (cache_evictions_total) and the cache size."
