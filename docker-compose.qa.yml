# QA stack: full packaged image (Dockerfile's `runtime` stage — no `target:` override, unlike
# docker-compose.yml's dev service), SPRING_PROFILES_ACTIVE=qa. Secrets load exclusively from an
# external keys.properties via KeysPropertiesEnvironmentPostProcessor — that loader is fail-fast on
# the qa profile (see its class docs), so this stack refuses to start with placeholder/missing
# secrets rather than silently booting half-configured.
#
# Not layered on top of docker-compose.yml on purpose: that file's `app` service builds only the
# `builder` stage and runs `mvnw spring-boot:run` for hot reload — neither applies here. This is a
# separate, self-contained stack; see docs/RUNBOOK.md.
#
# Usage:
#   CRONOS_KEYS_FILE_HOST=/path/to/qa/keys.properties docker compose -f docker-compose.qa.yml up -d --build
# or just:
#   ./scripts/start-qa.sh

services:
  app:
    build:
      context: .
    ports:
      - "9191:9191" # REST API (server.servlet.context-path=/api/v1)
    expose:
      - "9192" # Actuator — internal only, scraped by Prometheus
    environment:
      SPRING_PROFILES_ACTIVE: qa
      CRONOS_KEYS_FILE: /etc/cronos/keys.properties
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${CRONOS_KEYS_FILE_HOST:?Set CRONOS_KEYS_FILE_HOST to your qa keys.properties path}:/etc/cronos/keys.properties:ro
      - logs-qa:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data-qa:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data-qa:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - logs-qa:/var/log/cronos:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-qa:/prometheus
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000" # admin / ${GRAFANA_ADMIN_PASSWORD:-admin}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-qa:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  redis-data-qa:
  loki-data-qa:
  prometheus-data-qa:
  grafana-data-qa:
  logs-qa:
